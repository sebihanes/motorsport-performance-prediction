[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpp"
version = "0.2.0"
description = "Motorsport Performance Prediction - data pipeline and ML models"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
    "requests>=2.31",
    "fastf1>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "plotly>=5.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
